<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oi Digital Media CRM</title>
  <link rel="icon" href="assets/oi-digital-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080a;
      --panel: rgba(18, 20, 24, 0.86);
      --line: rgba(255, 255, 255, 0.08);
      --brand-primary: #E8205E;
      --brand-secondary: #F99B43;
    }
    html { background: var(--bg); }
    body {
      font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(232, 32, 94, 0.12), transparent 32rem),
        radial-gradient(circle at 80% 0%, rgba(249, 155, 67, 0.09), transparent 28rem),
        linear-gradient(180deg, #090a0d 0%, #07080a 46%, #050506 100%);
    }
    ::selection { background: rgba(232, 32, 94, 0.34); color: #f8fafc; }
    .app-shell {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(255,255,255,0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    .soft-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32), 0 0 48px rgba(232, 32, 94, 0.045);
      backdrop-filter: blur(18px);
    }
    .field-dark {
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(8, 10, 13, 0.78);
      color: #f4f4f5;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .field-dark:focus {
      border-color: rgba(232, 32, 94, 0.7);
      box-shadow: 0 0 0 3px rgba(232, 32, 94, 0.14);
      outline: none;
    }
    select.field-dark option {
      background: #101216;
      color: #f4f4f5;
    }
    .thin-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .thin-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 999px; }
    .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .swot-item {
      display: block;
      max-width: 100%;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .swot-item-clamp {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .drop-target-active {
      border-color: rgba(232, 32, 94, 0.55) !important;
      background: rgba(232, 32, 94, 0.055) !important;
      box-shadow: inset 0 0 0 1px rgba(249, 155, 67, 0.16), 0 18px 65px rgba(232, 32, 94, 0.12) !important;
    }
    .lead-card-dragging { opacity: .42; transform: scale(.985); }
    .column-dragging { opacity: .55; }
    .column-order-target {
      border-color: rgba(249, 155, 67, 0.68) !important;
      box-shadow: inset 0 0 0 2px rgba(249, 155, 67, 0.22), 0 18px 65px rgba(232, 32, 94, 0.12) !important;
    }
    [data-column-drag-handle] { touch-action: none; }
  </style>
</head>
<body class="min-h-screen bg-[#07080a] text-zinc-100 antialiased">
  <div id="app" class="min-h-screen"></div>
  <div id="processing-root"></div>

  <script>
    const API_URL = 'api.php';
    const ADMIN_EMAIL = 'comercial@oidigitalmedia.com';
    let PIPELINES = {
      real_estate: {
        key: 'real_estate',
        driver: 'file',
        title: 'Real Estate',
        heading: 'Real Estate CRM',
        eyebrow: 'Pipeline',
        subtitle: 'Pipeline principal com importação manual e status salvos em produção.',
        badge: 'CSV manual',
        statuses: ['Novo', 'Em andamento', 'Fechado'],
        supportsImport: true,
        supportsSync: false,
        supportsDelete: false,
        searchPlaceholder: 'Buscar por nome'
      }
    };
    const TIER_OPTIONS = ['All', 'A+', 'A', 'B', 'C', 'D'];
    const PAGE_SIZE = 15;
    const app = document.getElementById('app');

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !isProcessing()) {
        const modalRoot = document.getElementById('modal-root');
        const importRoot = document.getElementById('import-root');
        if (modalRoot && modalRoot.innerHTML.trim() !== '') {
          modalRoot.innerHTML = '';
          selectedLeadId = null;
        } else if (importRoot && importRoot.innerHTML.trim() !== '') {
          importRoot.innerHTML = '';
        }
      }
    });

    let currentPipeline = 'real_estate';
    let leads = [];
    let filters = { search: '', tier: 'All', approach: 'All', sort: 'tier_desc' };
    const SORT_OPTIONS = [
      { value: 'tier_desc', label: 'Maior Tier' },
      { value: 'tier_asc', label: 'Menor Tier' },
      { value: 'name_asc', label: 'Ordem alfabética (A–Z)' }
    ];
    const nameCollator = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });
    let columnLimits = {};
    let columnLabels = labelsFromStatuses(PIPELINES.real_estate.statuses);
    let currentStatuses = [...PIPELINES.real_estate.statuses];
    let selectedLeadId = null;
    let lastSynced = '';
    let lastUpdated = '';
    let syncMessage = '';
    let syncError = '';
    let isSyncing = false;
    let isColumnOperationPending = false;
    let draggedLeadId = null;
    let columnPointerDrag = null;
    let dragJustEnded = false;
    let pipelineDropdownAbortController = null;
    const updatingLeadIds = new Set();
    const pendingOperations = new Map();
    let processingFocus = null;
    let processingTimer = null;
    let processingOverflow = '';
    let sessionExpired = false;

    const escapeHtml = (value) => String(value || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const normalize = (value) => String(value || '').toLowerCase().trim();
    const pipelineConfig = () => PIPELINES[currentPipeline];
    const boardStatuses = () => currentStatuses;
    const apiEndpoint = (action) => `${API_URL}?action=${encodeURIComponent(action)}&pipeline=${encodeURIComponent(currentPipeline)}`;
    const getLead = (id) => leads.find((lead) => lead.Lead_ID === id);
    const uniqueApproaches = () => [...new Set(leads.map((lead) => lead.Approach_Type).filter(Boolean))].sort();

    async function apiFetch(url, opts = {}) {
      const res = await fetch(url, { credentials: 'same-origin', ...opts });
      if (res.status === 401) {
        sessionExpired = true;
        throw new Error('Sua sessão expirou. Entre novamente.');
      }
      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.error || `O servidor respondeu com erro ${res.status}. Tente novamente após conferir a conexão.`);
      }
      return res;
    }

    const isProcessing = () => pendingOperations.size > 0;

    function renderProcessingOverlay() {
      const root = document.getElementById('processing-root');
      const messages = [...pendingOperations.values()];
      if (!messages.length) {
        root.replaceChildren();
        return;
      }
      root.innerHTML = `
        <div class="fixed inset-0 z-[100] flex cursor-wait items-center justify-center bg-black/60 px-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="processing-title" aria-describedby="processing-message processing-hint" tabindex="-1" id="processing-dialog">
          <div class="flex w-full max-w-md items-center gap-4 rounded-2xl border border-rose-500/25 bg-[#101216] p-6 shadow-[0_24px_90px_rgba(0,0,0,.65),0_0_45px_rgba(232,32,94,.12)]">
            <span class="h-8 w-8 shrink-0 animate-spin rounded-full border-2 border-white/10 border-r-orange-400 border-t-[#E8205E]" aria-hidden="true"></span>
            <div role="status" aria-live="polite" aria-atomic="true">
              <p id="processing-title" class="text-xs font-extrabold uppercase tracking-[0.2em] text-orange-300">Processando</p>
              <p id="processing-message" class="mt-2 text-sm font-semibold leading-6 text-zinc-100">${escapeHtml(messages[messages.length - 1])}</p>
              <p id="processing-hint" class="mt-2 text-xs leading-5 text-zinc-400">Aguarde a conclusão. As ações estão temporariamente bloqueadas.</p>
            </div>
          </div>
        </div>`;
      document.getElementById('processing-dialog').focus({ preventScroll: true });
    }

    async function withProcessing(message, task, { allowNested = false } = {}) {
      if (isProcessing() && !allowNested) return;
      const token = Symbol('operation');
      const first = !isProcessing();
      if (first) {
        processingFocus = document.activeElement;
        processingOverflow = document.body.style.overflow;
      }
      pendingOperations.set(token, message);
      try {
        app.inert = true;
        app.setAttribute('aria-busy', 'true');
        document.body.style.overflow = 'hidden';
        renderProcessingOverlay();
        if (first) {
          processingTimer = setTimeout(() => {
            const hint = document.getElementById('processing-hint');
            if (hint) hint.textContent = 'A resposta está demorando um pouco. Ainda estamos aguardando a conclusão; não repita a ação.';
          }, 10000);
        }
        return await task();
      } finally {
        pendingOperations.delete(token);
        if (isProcessing()) {
          renderProcessingOverlay();
        } else {
          clearTimeout(processingTimer);
          processingTimer = null;
          renderProcessingOverlay();
          app.inert = false;
          app.removeAttribute('aria-busy');
          document.body.style.overflow = processingOverflow;
          if (sessionExpired) {
            sessionExpired = false;
            renderLoginScreen('Sua sessão expirou. Entre novamente.');
          } else if (processingFocus?.isConnected) {
            processingFocus.focus({ preventScroll: true });
          }
          processingFocus = null;
        }
      }
    }

    // Também bloqueia eventos já enfileirados e navegação pelo teclado.
    ['click', 'dblclick', 'pointerdown', 'keydown', 'submit', 'dragstart', 'drop'].forEach((type) => {
      document.addEventListener(type, (event) => {
        if (!isProcessing()) return;
        event.preventDefault();
        event.stopImmediatePropagation();
      }, true);
    });

    function labelsFromStatuses(statuses) {
      return statuses.reduce((labels, status) => {
        labels[status] = status;
        return labels;
      }, {});
    }

    function leadField(lead, ...keys) {
      const fieldMap = (pipelineConfig().display || {}).field_map || {};
      for (const key of keys) {
        const actualKey = fieldMap[key] || key;
        if (Object.prototype.hasOwnProperty.call(lead, actualKey) && String(lead[actualKey] || '').trim() !== '') {
          return lead[actualKey];
        }
      }
      return '';
    }

    function hydrateData(data) {
      const config = pipelineConfig();
      if (data.display) config.display = data.display;
      leads = Array.isArray(data.leads) ? data.leads : [];
      const serverStatuses = Array.isArray(data.statuses) && data.statuses.length ? data.statuses : config.statuses;
      currentStatuses = [...serverStatuses];

      leads.forEach((lead) => {
        const status = lead.Status || 'Novo';
        if (!currentStatuses.includes(status)) currentStatuses.push(status);
      });

      Object.keys(data.column_labels || {}).forEach((status) => {
        if (!currentStatuses.includes(status)) currentStatuses.push(status);
      });

      columnLabels = {
        ...labelsFromStatuses(currentStatuses),
        ...(data.column_labels || {})
      };
      lastSynced = data.last_synced || '';
      lastUpdated = data.last_updated || '';
    }

    function resetFilters() {
      filters = { search: '', tier: 'All', approach: 'All', sort: 'tier_desc' };
    }

    function resetColumnLimits() {
      columnLimits = {};
      currentStatuses.forEach((status) => {
        columnLimits[status] = PAGE_SIZE;
      });
    }

    function getColumnLimit(status) {
      if (!columnLimits[status]) columnLimits[status] = PAGE_SIZE;
      return columnLimits[status];
    }

    function formatDateTime(value) {
      if (!value) return 'Nunca';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    }

    function compactNumber(value) {
      const digits = String(value || '').replace(/[^\d.]/g, '');
      if (!digits) return value || '-';
      const number = Number(digits);
      if (!Number.isFinite(number)) return value || '-';
      return Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(number);
    }

    function statusLabel(status) {
      return columnLabels[status] || status;
    }

    function tierClasses(tier) {
      if (tier === 'A+') return { border: 'border-l-rose-500', badge: 'bg-rose-500/10 text-rose-100 ring-rose-500/30', glow: 'shadow-[0_0_28px_rgba(232,32,94,.12)]' };
      if (tier === 'A') return { border: 'border-l-orange-400', badge: 'bg-orange-400/10 text-orange-100 ring-orange-400/25', glow: 'shadow-[0_0_24px_rgba(249,155,67,.10)]' };
      if (tier === 'B') return { border: 'border-l-amber-300', badge: 'bg-amber-300/10 text-amber-100 ring-amber-300/25', glow: 'shadow-[0_0_20px_rgba(251,191,36,.07)]' };
      if (tier === 'D') return { border: 'border-l-rose-400', badge: 'bg-rose-400/10 text-rose-100 ring-rose-300/25', glow: 'shadow-[0_0_20px_rgba(251,113,133,.07)]' };
      return { border: 'border-l-zinc-500', badge: 'bg-zinc-700/55 text-zinc-200 ring-white/10', glow: '' };
    }

    function statusAccent(status) {
      const colors = {
        'Novo': { dot: 'bg-rose-500', text: 'text-rose-200', ring: 'ring-rose-500/25', line: 'from-rose-500/75', border: 'border-l-rose-500' },
        'Contatado': { dot: 'bg-orange-400', text: 'text-orange-200', ring: 'ring-orange-400/25', line: 'from-orange-400/75', border: 'border-l-orange-400' },
        'Qualificado': { dot: 'bg-rose-400', text: 'text-rose-100', ring: 'ring-rose-400/25', line: 'from-rose-400/75', border: 'border-l-rose-400' },
        'Top Agents': { dot: 'bg-orange-300', text: 'text-orange-100', ring: 'ring-orange-300/25', line: 'from-orange-300/75', border: 'border-l-orange-300' },
        'Em andamento': { dot: 'bg-orange-400', text: 'text-orange-100', ring: 'ring-orange-400/25', line: 'from-orange-400/75', border: 'border-l-orange-400' },
        'Em negociação': { dot: 'bg-rose-600', text: 'text-rose-200', ring: 'ring-rose-600/25', line: 'from-rose-600/75', border: 'border-l-rose-600' },
        'Respondeu': { dot: 'bg-orange-500', text: 'text-orange-200', ring: 'ring-orange-500/25', line: 'from-orange-500/75', border: 'border-l-orange-500' },
        'Call Marcada': { dot: 'bg-rose-500', text: 'text-rose-100', ring: 'ring-rose-500/25', line: 'from-rose-500/75', border: 'border-l-rose-500' },
        'Fechado': { dot: 'bg-orange-400', text: 'text-orange-100', ring: 'ring-orange-400/25', line: 'from-orange-400/75', border: 'border-l-orange-400' },
        'Descartado': { dot: 'bg-rose-700', text: 'text-rose-200', ring: 'ring-rose-700/25', line: 'from-rose-700/75', border: 'border-l-rose-700' }
      };
      return colors[status] || { dot: 'bg-rose-500', text: 'text-rose-200', ring: 'ring-rose-500/20', line: 'from-rose-500/65', border: 'border-l-rose-500' };
    }

    function activityDot(activity) {
      const value = normalize(activity);
      if (value === 'high' || value === 'yes') return 'bg-rose-500';
      if (value === 'medium') return 'bg-amber-300';
      if (value === 'low' || value === 'no') return 'bg-rose-400';
      return 'bg-zinc-500';
    }

    function tierSortValue(lead) {
      const config = pipelineConfig();
      const fieldMap = (config.display || {}).field_map || {};
      const keys = config.driver === 'neon'
        ? ['Score AI', 'Tier', 'Score', 'New_Tier', 'Tier_Fase1']
        : ['New_Tier', 'Tier_Fase1', 'Tier', 'Score AI'];
      const letterRanks = { 'A+': 5, A: 4, B: 3, C: 2, D: 1 };
      for (const key of keys) {
        const value = String(lead[fieldMap[key] || key] ?? '').trim().replace(/^tier\s*[:#-]?\s*/i, '').toUpperCase();
        if (Object.prototype.hasOwnProperty.call(letterRanks, value)) return letterRanks[value];
        if (/^\d+(?:[.,]\d+)?$/.test(value)) {
          const number = Number(value.replace(',', '.'));
          if (Number.isFinite(number)) return number;
        }
      }
      return null;
    }

    function sortVisibleLeads(items) {
      return items.map((lead, index) => ({
        lead, index,
        tier: tierSortValue(lead),
        name: String(leadField(lead, 'Nome', 'Name')).trim()
      })).sort((a, b) => {
        if (filters.sort === 'tier_desc' || filters.sort === 'tier_asc') {
          if (a.tier === null && b.tier !== null) return 1;
          if (a.tier !== null && b.tier === null) return -1;
          if (a.tier !== b.tier) return filters.sort === 'tier_desc' ? b.tier - a.tier : a.tier - b.tier;
        }
        if (!a.name && b.name) return 1;
        if (a.name && !b.name) return -1;
        return nameCollator.compare(a.name, b.name) || a.index - b.index;
      }).map(item => item.lead);
    }

    function filteredLeads() {
      return sortVisibleLeads(leads.filter((lead) => {
        if (pipelineConfig().driver === 'neon') {
          const searchText = [
            leadField(lead, 'Nome', 'Name'),
            leadField(lead, 'Email'),
            leadField(lead, 'Number'),
            leadField(lead, 'Padronized Number'),
            leadField(lead, 'Lead_ID')
          ].join(' ');
          return normalize(searchText).includes(normalize(filters.search));
        }

        const matchesName = normalize(lead.Name).includes(normalize(filters.search));
        const matchesTier = filters.tier === 'All' || lead.New_Tier === filters.tier;
        const matchesApproach = filters.approach === 'All' || lead.Approach_Type === filters.approach;
        return matchesName && matchesTier && matchesApproach;
      }));
    }

    function renderPipelineTabs() {
      const activePipeline = pipelineConfig();
      return `
        <nav class="relative w-full sm:w-72" data-pipeline-dropdown>
          <button id="pipeline-dropdown-toggle" type="button" aria-controls="pipeline-dropdown-menu" aria-expanded="false" class="flex w-full items-center justify-between gap-3 rounded-xl border border-rose-500/35 bg-rose-500/10 px-3.5 py-2.5 text-left text-rose-50 shadow-[0_0_28px_rgba(232,32,94,.12)] transition hover:border-rose-500/60 hover:bg-rose-500/15 focus:outline-none focus:ring-2 focus:ring-rose-500/35">
            <span class="min-w-0">
              <span class="block truncate text-sm font-extrabold">${escapeHtml(activePipeline.title)}</span>
              <span class="mt-0.5 block truncate text-[10px] font-bold uppercase tracking-[0.16em] text-orange-300/80">${escapeHtml(activePipeline.badge)}</span>
            </span>
            <svg class="h-4 w-4 shrink-0 text-orange-300 transition-transform" data-pipeline-chevron viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="pipeline-dropdown-menu" role="group" aria-label="Planilhas" class="hidden absolute right-0 top-full z-50 mt-2 max-h-80 w-full overflow-y-auto rounded-xl border border-white/[0.1] bg-[#101216] p-1.5 shadow-[0_24px_70px_rgba(0,0,0,.58)]">
            ${Object.values(PIPELINES).map((pipeline) => {
              const active = pipeline.key === currentPipeline;
              return `
                <div class="flex items-center gap-1">
                <button type="button" aria-pressed="${active}" data-pipeline-tab="${escapeHtml(pipeline.key)}" class="flex min-w-0 flex-1 items-center justify-between gap-3 rounded-lg px-3 py-2.5 text-left transition ${active ? 'bg-rose-500/15 text-rose-50' : 'text-zinc-300 hover:bg-white/[0.06] hover:text-white'}">
                  <span class="min-w-0">
                    <span class="block truncate text-sm font-bold">${escapeHtml(pipeline.title)}</span>
                    <span class="mt-0.5 block truncate text-[10px] font-bold uppercase tracking-[0.14em] ${active ? 'text-orange-300' : 'text-zinc-600'}">${escapeHtml(pipeline.badge)}</span>
                  </span>
                  ${active ? '<span class="h-2 w-2 shrink-0 rounded-full bg-[#E8205E] shadow-[0_0_12px_rgba(232,32,94,.75)]"></span>' : ''}
                </button>
                ${pipeline.driver === 'neon' && pipeline.key !== 'real_estate' ? `<button type="button" data-delete-pipeline="${escapeHtml(pipeline.key)}" title="Excluir pipeline" aria-label="Excluir pipeline ${escapeHtml(pipeline.title)}" class="shrink-0 rounded-lg p-2 text-zinc-400 transition hover:bg-rose-500/15 hover:text-rose-300">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="h-4 w-4" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>
                </button>` : ''}
                </div>
              `;
            }).join('')}
            <div class="mt-1 border-t border-white/[0.08] pt-1">
              <button id="add-sheet-link-btn" type="button" class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left transition text-rose-300 hover:bg-rose-500/15 hover:text-rose-100">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="h-4 w-4 shrink-0" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                <span class="text-sm font-bold">Adicionar nova planilha</span>
              </button>
            </div>
          </div>
        </nav>
      `;
    }

    function renderHeaderShell(actions = '') {
      const config = pipelineConfig();
      return `
        <header class="sticky top-0 z-30 border-b border-white/[0.07] bg-[#07080a]/88 px-4 py-4 backdrop-blur-xl">
          <div class="mx-auto max-w-[1760px]">
            <div class="relative overflow-visible rounded-2xl border border-white/[0.08] bg-white/[0.025] p-4 shadow-[0_18px_70px_rgba(0,0,0,.24)]">
              <div class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-rose-500/70 via-orange-400/40 to-transparent"></div>
              <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                <div class="flex min-w-0 items-center gap-4">

    function bindPipelineTabs() {
      pipelineDropdownAbortController?.abort();
      pipelineDropdownAbortController = new AbortController();
      const { signal } = pipelineDropdownAbortController;
      const toggle = document.getElementById('pipeline-dropdown-toggle');
      const menu = document.getElementById('pipeline-dropdown-menu');
      const chevron = toggle?.querySelector('[data-pipeline-chevron]');

      const closeDropdown = () => {
        menu?.classList.add('hidden');
        toggle?.setAttribute('aria-expanded', 'false');
        chevron?.classList.remove('rotate-180');
      };

      toggle?.addEventListener('click', (event) => {
        event.stopPropagation();
        const shouldOpen = menu.classList.contains('hidden');
        menu.classList.toggle('hidden', !shouldOpen);
        toggle.setAttribute('aria-expanded', String(shouldOpen));
        chevron?.classList.toggle('rotate-180', shouldOpen);
      }, { signal });

      document.querySelectorAll('[data-pipeline-tab]').forEach((button) => {
        button.addEventListener('click', () => {
          closeDropdown();
          if (button.dataset.pipelineTab === currentPipeline) return;
          currentPipeline = button.dataset.pipelineTab;
          selectedLeadId = null;
          syncMessage = '';
          syncError = '';
          isSyncing = false;
          resetFilters();
          loadLeads();
        }, { signal });
      });

      document.getElementById('add-sheet-link-btn')?.addEventListener('click', (event) => {
        event.stopPropagation();
        closeDropdown();
        renderSheetModal();
      }, { signal });

      document.addEventListener('click', closeDropdown, { signal });
      document.querySelectorAll('[data-delete-pipeline]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          deletePipeline(button.dataset.deletePipeline);
        }, { signal });
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeDropdown();
      }, { signal });

      const logoutButton = document.getElementById('logout-button');
      if (logoutButton) {
        logoutButton.addEventListener('click', async () => {
          return withProcessing('Encerrando a sessão...', async () => {
            try {
              await fetch(`${API_URL}?action=logout`, { method: 'POST', credentials: 'same-origin' });
            } catch (_) {
              // segue pro login mesmo se a chamada falhar
            }
            renderLoginScreen();
          });
        }, { signal });
      }
    }

    async function saveColumnLabels(options = {}) {
      const response = await apiFetch(apiEndpoint('update_column_labels'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          statuses: currentStatuses,
          column_labels: columnLabels,
          ...(options.moveRemovedLeadsTo ? { move_removed_leads_to: options.moveRemovedLeadsTo } : {})
        })
      });
      const data = await response.json();
      if (!data.success) throw new Error(data.error || 'Erro ao salvar nomes das colunas');
      if (Array.isArray(data.statuses) && data.statuses.length) {
        currentStatuses = [...data.statuses];
        pipelineConfig().statuses = [...data.statuses];
        if (Array.isArray(pipelineConfig().boardStatuses)) {
          pipelineConfig().boardStatuses = [...data.statuses];
        }
      }
      columnLabels = {
        ...labelsFromStatuses(currentStatuses),
        ...(data.column_labels || {})
      };
      return columnLabels;
    }

    async function deletePipeline(key) {
      if (isProcessing()) return;
      const target = PIPELINES[key];
      if (!target || target.driver !== 'neon' || key === 'real_estate') return;
      const confirmed = window.confirm(`Excluir o pipeline “${target.title}”?\n\nTodos os leads, status e notas desse pipeline serão apagados do CRM para todos os usuários. Esta ação não pode ser desfeita pelo CRM.\n\nA planilha do Google Sheets não será alterada.`);
      if (!confirmed) return;
      await withProcessing(`Excluindo o pipeline “${target.title}” e seus leads...`, async () => {
        try {
          const response = await apiFetch(`${API_URL}?action=delete_pipeline`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pipeline: key, confirmed: true })
          });
          const data = await response.json();
          if (!data.success) throw new Error(data.error || 'Não foi possível excluir o pipeline.');
          delete PIPELINES[key];
          syncError = '';
          syncMessage = `Pipeline “${target.title}” excluído. A planilha do Google Sheets foi preservada.`;
          if (currentPipeline === key) {
            currentPipeline = 'real_estate';
            selectedLeadId = null;
            leads = [];
            resetFilters();
            await loadLeads({ withinOperation: true });
          } else {
            renderCurrentView();
          }
        } catch (error) {
          window.alert(`Não foi possível concluir a exclusão: ${error.message}`);
        }
      });
    }

    async function createNewColumn() {
      if (isProcessing()) return;
      if (isColumnOperationPending) return;
      const input = window.prompt('Nome da nova coluna:');
      if (input === null) return;

      const status = input.trim();
      if (!status) {
        window.alert('Digite um nome válido para a coluna.');
        return;
      }
      if (currentStatuses.some((item) => normalize(item) === normalize(status))) {
        window.alert('Já existe uma coluna com esse nome.');
        return;
      }

      return withProcessing(`Criando a coluna “${status}”...`, async () => {
        const previousBoardStatuses = Array.isArray(pipelineConfig().boardStatuses) ? [...pipelineConfig().boardStatuses] : null;
        currentStatuses.push(status);
        columnLabels[status] = status;
        columnLimits[status] = PAGE_SIZE;
        if (previousBoardStatuses) {
          pipelineConfig().boardStatuses = [...currentStatuses];
        }
        isColumnOperationPending = true;
        renderCRM();

        try {
          await saveColumnLabels();
          syncError = '';
          syncMessage = `Coluna “${status}” criada.`;
        } catch (error) {
          currentStatuses = currentStatuses.filter((item) => item !== status);
          if (previousBoardStatuses) pipelineConfig().boardStatuses = previousBoardStatuses;
          delete columnLabels[status];
          delete columnLimits[status];
          syncMessage = '';
          syncError = `Não foi possível criar a coluna: ${error.message}`;
        } finally {
          isColumnOperationPending = false;
        }
        renderCRM();
      });
    }

    async function removeColumn(status) {
      if (isProcessing()) return;
      if (isColumnOperationPending) return;
      if (!currentStatuses.includes(status)) return;
      if (currentStatuses.length <= 1) {
        window.alert('O quadro precisa ter pelo menos uma coluna.');
        return;
      }

      const arrivalStatus = currentStatuses.find((item) => item !== status);
      const affectedLeads = leads.filter((lead) => (lead.Status || 'Novo') === status).length;
      const arrivalLabel = statusLabel(arrivalStatus);
      const confirmation = affectedLeads
        ? `Remover a coluna “${statusLabel(status)}”? Os ${affectedLeads} lead(s) serão enviados para “${arrivalLabel}”.`
        : `Remover a coluna “${statusLabel(status)}” para todos os usuários?`;
      if (!window.confirm(confirmation)) return;

      return withProcessing('Movendo os leads e removendo a coluna...', async () => {
        const removedLabel = statusLabel(status);
        const previousStatuses = [...currentStatuses];
        const previousBoardStatuses = Array.isArray(pipelineConfig().boardStatuses) ? [...pipelineConfig().boardStatuses] : null;
        const previousLabels = { ...columnLabels };
        const previousLeadStatuses = leads.map((lead) => ({ lead, status: lead.Status || 'Novo' }));
        currentStatuses = currentStatuses.filter((item) => item !== status);
        leads.forEach((lead) => {
          if ((lead.Status || 'Novo') === status) lead.Status = arrivalStatus;
        });
        delete columnLabels[status];
        delete columnLimits[status];
        if (previousBoardStatuses) {
          pipelineConfig().boardStatuses = [...currentStatuses];
        }
        isColumnOperationPending = true;
        renderCRM();

        try {
          await saveColumnLabels({ moveRemovedLeadsTo: arrivalStatus });
          syncError = '';
          syncMessage = `Coluna “${removedLabel}” removida.`;
        } catch (error) {
          currentStatuses = previousStatuses;
          if (previousBoardStatuses) pipelineConfig().boardStatuses = previousBoardStatuses;
          columnLabels = previousLabels;
          previousLeadStatuses.forEach((entry) => { entry.lead.Status = entry.status; });
          syncMessage = '';
          syncError = `Não foi possível remover a coluna: ${error.message}`;
        } finally {
          isColumnOperationPending = false;
        }
        renderCRM();
      });
    }

    async function moveColumn(status, direction) {
      if (isProcessing()) return;
      return withProcessing('Salvando a ordem das colunas...', async () => {
        if (isColumnOperationPending) return;
        const currentIndex = currentStatuses.indexOf(status);
        const targetIndex = currentIndex + direction;
        if (currentIndex < 0 || targetIndex < 0 || targetIndex >= currentStatuses.length) return;

        const previousStatuses = [...currentStatuses];
        const previousBoardStatuses = Array.isArray(pipelineConfig().boardStatuses) ? [...pipelineConfig().boardStatuses] : null;

        const item = currentStatuses.splice(currentIndex, 1)[0];
        currentStatuses.splice(targetIndex, 0, item);
        if (previousBoardStatuses) {
          pipelineConfig().boardStatuses = [...currentStatuses];
        }

        isColumnOperationPending = true;
        renderCRM();

        try {
          await saveColumnLabels();
          syncError = '';
          syncMessage = 'Ordem das colunas atualizada para todos os usuários.';
        } catch (error) {
          currentStatuses = previousStatuses;
          if (previousBoardStatuses) pipelineConfig().boardStatuses = previousBoardStatuses;
          syncMessage = '';
          syncError = `Não foi possível reordenar as colunas: ${error.message}`;
        } finally {
          isColumnOperationPending = false;
        }
        renderCRM();
      });
    }

    async function moveColumnTo(status, targetStatus, placeAfter = false) {
      if (isProcessing()) return;
      return withProcessing('Salvando a ordem das colunas...', async () => {
        if (isColumnOperationPending || status === targetStatus) return;
        const previousStatuses = [...currentStatuses];
        const previousBoardStatuses = Array.isArray(pipelineConfig().boardStatuses) ? [...pipelineConfig().boardStatuses] : null;

        const nextStatuses = currentStatuses.filter((item) => item !== status);
        let targetIndex = nextStatuses.indexOf(targetStatus);
        if (targetIndex < 0) return;
        if (placeAfter) targetIndex += 1;
        nextStatuses.splice(targetIndex, 0, status);
        if (nextStatuses.every((item, index) => item === currentStatuses[index])) return;

        currentStatuses = nextStatuses;
        if (previousBoardStatuses) {
          pipelineConfig().boardStatuses = [...currentStatuses];
        }

        isColumnOperationPending = true;
        renderCRM();
        try {
          await saveColumnLabels();
          syncError = '';
          syncMessage = 'Ordem das colunas atualizada para todos os usuários.';
        } catch (error) {
          currentStatuses = previousStatuses;
          if (previousBoardStatuses) pipelineConfig().boardStatuses = previousBoardStatuses;
          syncMessage = '';
          syncError = `Não foi possível reordenar as colunas: ${error.message}`;
        } finally {
          isColumnOperationPending = false;
        }
        renderCRM();
      });
    }

    async function loadLeads(options = {}) {
      return withProcessing('Carregando os dados do quadro...', async () => {
        const config = pipelineConfig();
        app.innerHTML = `<div class="app-shell flex min-h-screen items-center justify-center text-sm font-medium text-zinc-500">Carregando ${escapeHtml(config.title)}...</div>`;

        try {
          const response = await apiFetch(apiEndpoint('get_leads'));
          const data = await response.json();
          if (!data.success) throw new Error(data.error || 'Erro ao carregar leads');

          hydrateData(data);
          resetColumnLimits();

          // Abrir o quadro lê somente o Neon. A sincronização é uma ação explícita.

          renderCurrentView();
        } catch (error) {
          renderLoadError(error.message);
        }
      }, { allowNested: options.withinOperation === true });
    }

    function renderLoadError(message) {
      app.innerHTML = `
        <div class="app-shell min-h-screen px-4 py-5">
          <div class="mx-auto flex max-w-[1760px] flex-col gap-4">
            ${renderPipelineTabs()}
            <div class="soft-panel rounded-xl p-5 text-sm text-rose-200">${escapeHtml(message)}</div>
          </div>
        </div>

      bindPipelineTabs();

    function renderCurrentView() {
      if (pipelineConfig().supportsImport && leads.length === 0) {
        renderImportScreen(syncError || syncMessage);
        return;
      }

      renderCRM();
    }

    async function syncPipeline(options = {}) {
      if (isProcessing()) return;
      return withProcessing('Sincronizando os dados com a planilha...', async () => {
        if (!pipelineConfig().supportsSync) return;

        isSyncing = true;
        syncError = '';
        syncMessage = options.automatic ? 'Sincronizando automaticamente com a planilha...' : 'Sincronizando com a planilha...';
        renderCRM();

        try {
          const response = await apiFetch(apiEndpoint('sync'), { method: 'POST' });
          const text = await response.text();
          const data = JSON.parse(text);
          if (!data.success) throw new Error(data.error || 'Erro no sync');

          hydrateData(data);
          resetColumnLimits();
          syncError = '';
          syncMessage = `Sincronizado: ${data.imported || 0} linhas válidas (${data.new || 0} novos, ${data.updated || 0} atualizados, ${data.skipped || 0} ignorados).`;
        } catch (error) {
          syncMessage = '';
          syncError = `Sync falhou: ${error.message}. Mantendo os dados salvos.`;
        } finally {
          isSyncing = false;
          renderCRM();
        }
      });
    }

    function splitShortNote(note) {
      const parts = String(note || '').split('||');
      const positives = splitNoteItems(parts[0]);
      const negatives = splitNoteItems(parts.slice(1).join('||'));
      return { positives, negatives };
    }

    function splitNoteItems(value) {
      return String(value || '')
        .split('|')
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function normalizeSocialUrl(type, value) {
      const rawValue = String(value || '').trim();
      if (!rawValue) return '';
      if (/^https?:\/\//i.test(rawValue)) return rawValue;

      if (type === 'instagram') {
        const handle = rawValue
          .replace(/^@/, '')
          .replace(/^instagram\.com\//i, '')
          .replace(/^www\.instagram\.com\//i, '')
          .replace(/^\/+/, '')
          .split(/[/?#]/)[0];
        return handle ? `https://www.instagram.com/${handle}` : '';
      }

      if (type === 'linkedin') {
        if (/^(www\.)?linkedin\.com\//i.test(rawValue)) return `https://${rawValue}`;
        const handle = rawValue.replace(/^@/, '').replace(/^\/+/, '');
        return handle ? `https://www.linkedin.com/in/${handle}` : '';
      }

      return rawValue;
    }

    function safeWebUrl(value) {
      const url = String(value || '').trim();
      return /^https?:\/\/[^\s]+$/i.test(url) ? url : '';
    }

    function renderCardLink(label, url, type) {
      const href = safeWebUrl(normalizeSocialUrl(type, url));
      if (!href) {
        return `<span class="rounded-full border border-white/[0.06] px-2 py-1 text-[11px] font-bold text-zinc-600">${label}</span>`;
      }

      return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" class="card-link rounded-full border border-white/10 bg-white/[0.04] px-2 py-1 text-[11px] font-bold text-zinc-300 transition hover:border-orange-400/45 hover:text-orange-100">${label}</a>`;
    }

    function renderSwotList(items, emptyText) {

      return visibleItems.map((item) => `<p class="swot-item swot-item-clamp text-xs leading-4 text-zinc-400" title="${escapeHtml(item)}">${escapeHtml(item)}</p>`).join('');

          <div class="mt-3 min-w-0 overflow-hidden border-t border-white/[0.07] pt-3">

    function isUtmField(key) {
      return normalize(key).startsWith('utm_');
    }

    function launchResponseEntries(lead) {
      const fieldMap = (pipelineConfig().display || {}).field_map || {};
      const mappedValues = new Set(Object.values(fieldMap));
      const coreFields = new Set(['Lead_ID', 'Nome', 'Name', 'Email', 'Number', 'Padronized Number', 'Score AI', 'DateTime', 'Status', 'Internal_Notes', ...mappedValues]);
      return Object.keys(lead)
        .filter((key) => !coreFields.has(key) && !isUtmField(key) && String(lead[key] || '').trim() !== '')
        .map((key) => ({ key, value: lead[key] }));
    }

    function launchUtmEntries(lead) {
      return Object.keys(lead)
        .filter((key) => isUtmField(key) && String(lead[key] || '').trim() !== '')
        .map((key) => ({ key, value: lead[key] }));
    }

    function renderLaunchLeadCard(lead, status) {
      const accent = statusAccent(status);
      const name = leadField(lead, 'Nome', 'Name') || lead.Lead_ID || 'Lead sem nome';

      const score = leadField(lead, 'Score AI') || '-';
      const dateTime = leadField(lead, 'DateTime') || '-';
      const responses = launchResponseEntries(lead).slice(0, 2);
      const utms = launchUtmEntries(lead);
      const isMoving = updatingLeadIds.has(lead.Lead_ID);

      return `
        <article data-lead-id="${escapeHtml(lead.Lead_ID)}" draggable="${!isMoving}" ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)" aria-busy="${isMoving}" tabindex="0" class="lead-card group relative w-full min-w-0 cursor-grab overflow-hidden rounded-2xl border border-white/[0.08] ${accent.border} ${isMoving ? 'pointer-events-none animate-pulse opacity-60' : ''} border-l-4 bg-[#101216]/92 p-4 text-left shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-rose-500/30 hover:bg-[#14171d] focus:outline-none focus:ring-2 focus:ring-rose-500/35 active:cursor-grabbing">
          ${isMoving ? '<span class="absolute right-3 top-3 z-10 rounded-full border border-orange-400/25 bg-orange-400/10 px-2 py-1 text-[10px] font-extrabold uppercase tracking-[0.12em] text-orange-200">Movendo...</span>' : ''}
          <div class="flex items-start justify-between gap-3">

              <p class="mt-0.5 truncate text-sm font-bold text-zinc-100">${escapeHtml(number)}</p>

            <div class="min-w-0 overflow-hidden rounded-xl border border-white/[0.07] bg-white/[0.035] px-2.5 py-2">

              <p class="mt-0.5 truncate text-sm font-bold text-zinc-100">${escapeHtml(dateTime)}</p>
            </div>
          </div>
          <div class="mt-3 grid min-w-0 gap-2 overflow-hidden border-t border-white/[0.07] pt-3">

              <div class="min-w-0 overflow-hidden">
                <p class="truncate text-[10px] font-bold uppercase tracking-[0.18em] text-zinc-600">${escapeHtml(item.key)}</p>

          </div>
        </article>
      `;
    }

    function clearDropTargets() {
      document.querySelectorAll('[data-drop-column]').forEach((column) => column.classList.remove('drop-target-active'));
    }

    function clearColumnOrderTargets() {
      document.querySelectorAll('[data-drop-column]').forEach((column) => column.classList.remove('column-order-target', 'column-dragging'));
    }

    function startColumnPointerDrag(event) {
      if (isColumnOperationPending || (event.pointerType === 'mouse' && event.button !== 0)) return;
      const handle = event.currentTarget;
      const status = handle.dataset.columnDragHandle;
      const sourceColumn = handle.closest('[data-drop-column]');
      if (!status || !sourceColumn) return;

      event.preventDefault();
      handle.setPointerCapture?.(event.pointerId);
      columnPointerDrag = {
        pointerId: event.pointerId,
        status,
        startX: event.clientX,
        startY: event.clientY,
        active: false,
        targetStatus: null,
        placeAfter: false,
        handle
      };
      sourceColumn.classList.add('column-dragging');
    }

    function updateColumnPointerDrag(event) {
      const drag = columnPointerDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      const distance = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
      if (!drag.active && distance < 6) return;

      event.preventDefault();
      drag.active = true;
      document.body.style.userSelect = 'none';
      document.querySelectorAll('[data-drop-column]').forEach((column) => column.classList.remove('column-order-target'));

      const targetColumn = document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-drop-column]');
      if (!targetColumn || targetColumn.dataset.status === drag.status) {
        drag.targetStatus = null;
        return;
      }

      const rect = targetColumn.getBoundingClientRect();
      drag.targetStatus = targetColumn.dataset.status;
      drag.placeAfter = event.clientX > rect.left + (rect.width / 2);
      targetColumn.classList.add('column-order-target');
    }

    async function finishColumnPointerDrag(event, cancelled = false) {
      const drag = columnPointerDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;

      columnPointerDrag = null;
      document.body.style.userSelect = '';
      try { drag.handle.releasePointerCapture?.(event.pointerId); } catch (_) {}
      clearColumnOrderTargets();

      if (!cancelled && drag.active && drag.targetStatus) {
        await moveColumnTo(drag.status, drag.targetStatus, drag.placeAfter);
      }
    }

    function handleDragStart(event) {
      const card = event.currentTarget;
      const leadId = card.dataset.leadId;
      if (!leadId || updatingLeadIds.has(leadId)) {
        event.preventDefault();
        return;
      }

      draggedLeadId = leadId;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', leadId);
      requestAnimationFrame(() => card.classList.add('lead-card-dragging'));
    }

    function handleDragEnd(event) {
      event.currentTarget.classList.remove('lead-card-dragging');
      draggedLeadId = null;
      clearDropTargets();
      dragJustEnded = true;
      setTimeout(() => { dragJustEnded = false; }, 0);
    }

    function handleDragOver(event) {
      if (!draggedLeadId) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      clearDropTargets();
      event.currentTarget.classList.add('drop-target-active');
    }

    function handleDragLeave(event) {
      if (!event.currentTarget.contains(event.relatedTarget)) {
        event.currentTarget.classList.remove('drop-target-active', 'column-order-target');
      }
    }

    async function handleDrop(event) {
      event.preventDefault();
      const newStatus = event.currentTarget.dataset.status;
      const leadId = event.dataTransfer.getData('text/plain') || draggedLeadId;
      clearDropTargets();
      if (!leadId || !newStatus) return;
      await moveLeadToStatus(leadId, newStatus);
    }

    async function moveLeadToStatus(leadId, newStatus) {
      if (isProcessing()) return;
      return withProcessing(`Movendo o lead para “${statusLabel(newStatus)}”...`, async () => {
        const lead = getLead(leadId);
        if (!lead || updatingLeadIds.has(leadId)) return;

        const previousStatus = lead.Status || 'Novo';
        if (previousStatus === newStatus) return;

        const endpoint = apiEndpoint('update_lead');
        const payload = { Lead_ID: leadId, Status: newStatus };
        updatingLeadIds.add(leadId);
        lead.Status = newStatus;
        syncError = '';
        syncMessage = `Movendo lead para “${statusLabel(newStatus)}”...`;
        renderCRM();

        try {
          const response = await apiFetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (!data.success) throw new Error(data.error || 'Erro ao atualizar status');
          syncMessage = `Lead movido para “${statusLabel(newStatus)}”.`;
        } catch (error) {
          lead.Status = previousStatus;
          syncMessage = '';
          syncError = `Não foi possível mover o lead: ${error.message}`;
        } finally {
          updatingLeadIds.delete(leadId);
          draggedLeadId = null;
          renderCRM();
        }
      });
    }

    function bindFilters() {
      document.querySelectorAll('.lead-card').forEach((card) => {
        card.addEventListener('click', () => {
          if (!dragJustEnded) openLeadModal(card.dataset.leadId);
        });
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openLeadModal(card.dataset.leadId);
          }
        });
      });

      document.querySelectorAll('.card-link').forEach((link) => {
        link.addEventListener('click', (event) => event.stopPropagation());
      });

      document.querySelectorAll('.column-label').forEach((input) => {
        input.dataset.savedLabel = input.value;
        input.addEventListener('click', (event) => event.stopPropagation());
        input.addEventListener('input', (event) => {
          const status = event.target.dataset.columnLabel;
          columnLabels[status] = event.target.value || status;
        });
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            event.target.blur();
          }
        });
        input.addEventListener('blur', async (event) => {
          if (isProcessing()) return;
          const status = event.target.dataset.columnLabel;
          if (!event.target.value.trim()) {
            columnLabels[status] = status;
            event.target.value = columnLabels[status];
          }
          if (input.value === input.dataset.savedLabel) return;
          await withProcessing('Salvando o nome da coluna...', async () => {
            try {
              await saveColumnLabels();
              input.dataset.savedLabel = input.value;
            } catch (error) {
              columnLabels[status] = input.dataset.savedLabel;
              input.value = input.dataset.savedLabel;
              window.alert(`Não foi possível salvar o nome: ${error.message}`);
            }
          });
        });
      });

      document.querySelectorAll('.load-more').forEach((button) => {
        button.addEventListener('click', () => {
          const status = button.dataset.loadMore;
          columnLimits[status] = getColumnLimit(status) + PAGE_SIZE;
          renderCRM();
        });
      });

      document.getElementById('add-column')?.addEventListener('click', createNewColumn);
      document.querySelectorAll('[data-column-drag-handle]').forEach((handle) => {
        handle.addEventListener('pointerdown', startColumnPointerDrag);
        handle.addEventListener('pointermove', updateColumnPointerDrag);
        handle.addEventListener('pointerup', (event) => finishColumnPointerDrag(event));
        handle.addEventListener('pointercancel', (event) => finishColumnPointerDrag(event, true));
        handle.addEventListener('lostpointercapture', (event) => {
          if (columnPointerDrag?.pointerId === event.pointerId) finishColumnPointerDrag(event, true);
        });
      });
      document.querySelectorAll('[data-remove-column]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          removeColumn(button.dataset.removeColumn);
        });
      });
      document.querySelectorAll('[data-move-column]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          moveColumn(button.dataset.moveColumn, Number(button.dataset.direction));
        });
      });

      const searchInput = document.getElementById('search-filter');
      if (searchInput) {
        searchInput.addEventListener('input', (event) => {
          filters.search = event.target.value;
          resetColumnLimits();
          renderCRM({ restoreSearchFocus: true });
        });
      }

      document.querySelectorAll('[data-filter-toggle]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          const menu = button.parentElement.querySelector('[data-filter-menu]');
          const shouldOpen = menu.classList.contains('hidden');
          closeFilterDropdowns(menu);
          menu.classList.toggle('hidden', !shouldOpen);
          button.setAttribute('aria-expanded', String(shouldOpen));
          if (shouldOpen) {
            setTimeout(() => document.addEventListener('click', () => closeFilterDropdowns(), { once: true }), 0);
          }
        });
      });

      document.querySelectorAll('[data-filter-option]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          filters[button.dataset.filterKey] = button.dataset.filterValue;
          resetColumnLimits();
          renderCRM();
        });
      });

      document.getElementById('clear-filters').addEventListener('click', () => {
        resetFilters();
        resetColumnLimits();
        renderCRM();
      });
    }

    async function saveField(field) {
      if (isProcessing()) return;
      const lead = getLead(selectedLeadId);
      if (!lead) return;

      const payload = { Lead_ID: lead.Lead_ID };
      if (field === 'Status') payload.Status = document.getElementById('status-input').value;
      if (field === 'Observação') payload['Observação'] = document.getElementById('observacao-input').value;
      if (field === 'Internal_Notes') payload.Internal_Notes = document.getElementById('notes-input').value;

      return withProcessing(field === 'Status' ? 'Salvando o status...' : field === 'Internal_Notes' ? 'Salvando as notas internas...' : 'Salvando as observações...', async () => {
        const message = document.getElementById('modal-message');
        message.textContent = 'Salvando...';

        try {
          const response = await apiFetch(apiEndpoint('update_lead'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (!data.success) throw new Error(data.error || 'Erro ao salvar');

          Object.assign(lead, payload);
          message.textContent = 'Salvo.';
          renderCRM();
          openLeadModal(lead.Lead_ID);
        } catch (error) {
          message.textContent = error.message;
        }
      });
    }

                <input id="add-lead-email" name="email" type="email" maxlength="150" placeholder="exemplo@dominio.com" class="field-dark mt-1.5 w-full rounded-xl px-3.5 py-2.5 text-sm">
              </label>
              <button type="submit" class="w-full rounded-xl bg-[#E8205E] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-rose-600">Salvar lead</button>
            </form>
            <p id="add-lead-message" role="status" class="mt-3 text-sm text-rose-300"></p>
          </section>
        </div>
      `;
      document.getElementById('close-add-lead-modal').addEventListener('click', () => root.innerHTML = '');
      bindAddLeadForm();
    }

    function bindAddLeadForm() {
      const form = document.getElementById('add-lead-form');
      if (!form) return;
      const message = document.getElementById('add-lead-message');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (isProcessing()) return;

        const nameInput = document.getElementById('add-lead-name');
        const phoneInput = document.getElementById('add-lead-phone');
        const emailInput = document.getElementById('add-lead-email');

        const nameVal = nameInput ? nameInput.value.trim() : '';
        const phoneVal = phoneInput ? phoneInput.value.trim() : '';
        const emailVal = emailInput ? emailInput.value.trim() : '';

        if (!nameVal) {
          if (message) message.textContent = 'Nome é obrigatório.';
          return;
        }

        const config = pipelineConfig();
        const payload = {};
        
        const now = new Date();
        const brtString = new Intl.DateTimeFormat('pt-BR', {
          timeZone: 'America/Sao_Paulo',
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        }).format(now).replace(',', '');

        if (config.driver === 'file') {
          payload.Name = nameVal;
          payload.DateTime = brtString;
          if (phoneVal) payload.Phone = phoneVal;
          if (emailVal) payload.Email = emailVal;
        } else {
          const fieldMap = (config.display || {}).field_map || {};
          let nameKey = fieldMap['Nome'] || fieldMap['Name'];
          if (!nameKey) {
            const sample = leads.find(l => l.Nome !== undefined || l.Name !== undefined);
            nameKey = (sample && sample.Nome !== undefined) ? 'Nome' : 'Name';
          }
          let phoneKey = fieldMap['Padronized Number'] || fieldMap['Number'] || fieldMap['Phone'] || fieldMap['Número'];
          if (!phoneKey) {
            const sample = leads.find(l => l['Padronized Number'] !== undefined || l.Number !== undefined || l.Phone !== undefined || l['Número'] !== undefined);
            if (sample) {
              if (sample['Padronized Number'] !== undefined) phoneKey = 'Padronized Number';
              else if (sample.Number !== undefined) phoneKey = 'Number';
              else if (sample['Número'] !== undefined) phoneKey = 'Número';
              else phoneKey = 'Phone';
            } else {
              phoneKey = 'Number';
            }
          }
          let emailKey = fieldMap['Email'] || 'Email';

          let dateKey = fieldMap['DateTime'] || fieldMap['Carimbo de data/hora'] || fieldMap['Data de Entrada'] || fieldMap['Data'] || fieldMap['Data de Criação'] || fieldMap['Timestamp'];
          if (!dateKey) {
            const sample = leads.find(l => l.DateTime !== undefined || l['Carimbo de data/hora'] !== undefined || l['Data'] !== undefined || l['Timestamp'] !== undefined || l['Data de Entrada'] !== undefined);
            if (sample) {
              if (sample.DateTime !== undefined) dateKey = 'DateTime';
              else if (sample['Carimbo de data/hora'] !== undefined) dateKey = 'Carimbo de data/hora';
              else if (sample['Data de Entrada'] !== undefined) dateKey = 'Data de Entrada';
              else if (sample['Data'] !== undefined) dateKey = 'Data';
              else if (sample['Timestamp'] !== undefined) dateKey = 'Timestamp';
              else dateKey = 'DateTime';
            } else {
              dateKey = 'DateTime';
            }
          }

          payload[nameKey] = nameVal;
          payload[dateKey] = brtString;
          if (phoneVal) payload[phoneKey] = phoneVal;
          if (emailVal) payload[emailKey] = emailVal;
        }

        return withProcessing('Criando novo lead...', async () => {
          if (message) message.textContent = '';
          try {
            const response = await apiFetch(apiEndpoint('add_lead'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!data.success || !data.lead) {
              throw new Error(data.error || 'Erro ao criar o lead');
            }

            const root = document.getElementById('modal-root');
            if (root) root.innerHTML = '';

            leads.unshift(data.lead);
            renderCurrentView();
          } catch (error) {
            if (message) message.textContent = error.message || 'Erro ao criar o lead';
          }
        });
      });
    }

    function renderSheetModal() {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/72 p-4 backdrop-blur-md">
          <section class="soft-panel max-h-[90vh] overflow-y-auto w-full max-w-lg rounded-2xl p-6">
            <div class="mb-5 flex items-center justify-between">
              <h2 class="text-lg font-semibold text-zinc-50">Nova Planilha</h2>
              <button id="close-sheet-modal" class="rounded-xl border border-white/10 bg-white/[0.04] px-3 py-1.5 text-sm font-semibold text-zinc-200 transition hover:bg-white/[0.08]">Fechar</button>
            </div>
            ${renderSheetRegistration(false)}
          </section>
        </div>
      `;
      document.getElementById('close-sheet-modal').addEventListener('click', () => root.innerHTML = '');
      bindSheetRegistration();
    }

    function renderSheetRegistration(withDivider = true) {
      const sectionClass = withDivider ? 'class="mt-6 border-t border-white/10 pt-6"' : 'class="pt-2"';
      return `<section ${sectionClass}>
        <h3 class="text-lg font-bold text-zinc-100">Adicionar planilha por link</h3>
        <p class="mt-2 text-sm leading-6 text-zinc-400">Crie uma nova fonte pelo link publicado do Google Sheets. Os dados serão importados e a planilha aparecerá no seletor do CRM.</p>
        <form id="sheet-registration-form" class="mt-4 space-y-4">
          <label class="block text-sm text-zinc-300">Nome da planilha
            <input name="name" required maxlength="120" placeholder="Ex.: Lançamento Claudia" class="field-dark mt-2 w-full rounded-xl px-3.5 py-2.5 text-sm">
          </label>
          <label class="block text-sm text-zinc-300">Link publicado
            <input name="url" type="url" required placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" class="field-dark mt-2 w-full rounded-xl px-3.5 py-2.5 text-sm">
          </label>
          <p class="text-xs leading-5 text-zinc-400">Em “Publicar na Web”, publique o documento inteiro. Todas as abas publicadas serão buscadas e unidas por Lead_ID. Cada aba precisa ter essa coluna. Abas novas são descobertas ao sincronizar. Limites: 20 abas, 5.000 leads, 5 MB por aba e 20 MB no total. Abas não publicadas não ficam acessíveis pelo link.</p>
          <button type="submit" class="w-full rounded-xl bg-[#E8205E] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-rose-600">Adicionar e importar planilha</button>
        </form>
        <div id="sheet-registration-message" role="status" class="mt-4 hidden rounded-xl bg-rose-500/10 border border-rose-500/20 p-4 text-sm font-semibold text-rose-300"></div>
      </section>`;
    }

    function bindSheetRegistration() {
      const form = document.getElementById('sheet-registration-form');
      if (!form) return;
      const message = document.getElementById('sheet-registration-message');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (isProcessing()) return;
        message.classList.add('hidden');
        message.textContent = '';
        const name = form.elements.namedItem('name').value.trim();
        const url = form.elements.namedItem('url').value.trim();
        if (!name || !url) { 
          message.textContent = 'Informe o nome e o link publicado.'; 
          message.classList.remove('hidden');
          return; 
        }
        let registered = false;
        await withProcessing('Buscando todas as abas publicadas e reunindo os dados dos leads. Aguarde...', async () => {
          try {
            const response = await apiFetch(`${API_URL}?action=create_sheet_pipeline`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, url })
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.error || 'Não foi possível cadastrar a planilha.');
            registered = true;
            await bootPipelines();
            currentPipeline = data.pipeline;
            selectedLeadId = null;
            resetFilters();
            syncError = '';
            syncMessage = `${data.existing ? 'Planilha existente atualizada' : 'Planilha cadastrada'}: ${data.imported} leads reunidos de ${data.sheet_count || 1} aba(s).${data.duplicates ? ` ${data.duplicates} linha(s) com ID repetido consolidada(s).` : ''}`;
            if (document.getElementById('modal-root')) document.getElementById('modal-root').innerHTML = '';
            if (document.getElementById('import-root')) document.getElementById('import-root').innerHTML = '';
            await loadLeads({ withinOperation: true });
          } catch (error) {
            message.textContent = (registered ? 'A planilha foi cadastrada, mas houve uma falha ao abrir o quadro. Tente novamente com o mesmo link. ' : '') + error.message;
            message.classList.remove('hidden');
          }
        });
      });
    }

    function bindImportForm(form, messageEl) {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (isProcessing()) return;
        const fileInput = form.querySelector('input[type="file"]');
        if (!fileInput.files.length) {
          messageEl.textContent = 'Selecione um CSV.';
          return;
        }

        const formData = new FormData();
        formData.append('csv', fileInput.files[0]);
        messageEl.textContent = 'Importando...';

        return withProcessing('Importando os leads do CSV...', async () => {
          try {
            const response = await apiFetch(apiEndpoint('import'), { method: 'POST', body: formData });
            const text = await response.text();
            const data = JSON.parse(text);
            if (!data.success) throw new Error(data.error || 'Erro no import');
            messageEl.textContent = 'Importação concluída. Atualizando o quadro...';
            await loadLeads({ withinOperation: true });
          } catch (error) {
            messageEl.textContent = error.message;
          }
        });
      });
    }

    function renderSetupScreen(message = '') {
      app.innerHTML = `
        <main class="app-shell flex min-h-screen items-center justify-center px-4 py-10">
          <section class="soft-panel w-full max-w-md rounded-2xl p-8">
            <div class="mb-7">
              <p class="mb-3 text-xs font-bold uppercase tracking-[0.28em] text-rose-300/90">Real Estate CRM</p>
              <h2 class="text-2xl font-semibold tracking-tight text-zinc-50">Primeiro acesso</h2>
              <p class="mt-2 text-sm leading-6 text-zinc-400">Defina a senha da conta administradora para começar a usar o CRM.</p>
            </div>
            <form id="setup-form" class="space-y-4">
              <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-[0.18em] text-zinc-500">Email</label>
                <input type="email" value="${escapeHtml(ADMIN_EMAIL)}" readonly disabled class="field-dark w-full rounded-xl px-3.5 py-2.5 text-sm opacity-60">
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-[0.18em] text-zinc-500">Nova senha</label>
                <input id="setup-password" type="password" minlength="8" required autocomplete="new-password" class="field-dark w-full rounded-xl px-3.5 py-2.5 text-sm">
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-[0.18em] text-zinc-500">Confirmar senha</label>
                <input id="setup-password-confirm" type="password" minlength="8" required autocomplete="new-password" class="field-dark w-full rounded-xl px-3.5 py-2.5 text-sm">
              </div>
              <button type="submit" class="w-full rounded-xl bg-[#E8205E] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-rose-600">Definir senha</button>
            </form>
            <p id="setup-message" class="mt-4 text-sm ${message ? 'text-orange-200' : 'text-zinc-500'}">${escapeHtml(message)}</p>
          </section>
        </main>
      `;
      bindSetupForm();
    }

    function bindSetupForm() {
      const form = document.getElementById('setup-form');
      const messageEl = document.getElementById('setup-message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('setup-password').value;
        if (isProcessing()) return;
        const passwordConfirm = document.getElementById('setup-password-confirm').value;

        if (password.length < 8) {
          messageEl.textContent = 'Senha muito curta (mínimo 8 caracteres).';
          messageEl.className = 'mt-4 text-sm text-rose-300';
          return;
        }
        if (password !== passwordConfirm) {
          messageEl.textContent = 'As senhas não coincidem.';
          messageEl.className = 'mt-4 text-sm text-rose-300';
          return;
        }

        messageEl.textContent = 'Salvando...';
        messageEl.className = 'mt-4 text-sm text-zinc-500';

        return withProcessing('Salvando a senha de acesso...', async () => {
          try {
            const response = await fetch(`${API_URL}?action=setup`, {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password })
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.error || 'Erro ao definir senha');
            renderLoginScreen('Senha criada. Faça login para continuar.');
          } catch (error) {
            messageEl.textContent = error.message;
            messageEl.className = 'mt-4 text-sm text-rose-300';
          }
        });
      });
    }

    function renderLoginScreen(message = '') {
      app.innerHTML = `
        <main class="app-shell flex min-h-screen items-center justify-center px-4 py-10">
          <section class="soft-panel w-full max-w-md rounded-2xl p-8">
            <div class="mb-7 text-center">
              <img src="assets/oi-digital-logo.png" alt="Oi Digital Media" width="88" height="88" class="mx-auto mb-6 h-[88px] w-[88px] rounded-full border border-rose-500/30 object-cover shadow-[0_0_38px_rgba(232,32,94,.22)]">
              <p class="mb-3 text-xs font-bold uppercase tracking-[0.28em] text-rose-300/90">Real Estate CRM</p>
              <h2 class="text-2xl font-semibold tracking-tight text-zinc-50">Entrar</h2>
              <p class="mt-2 text-sm leading-6 text-zinc-400">Acesse com sua conta de administrador.</p>
            </div>
            <form id="login-form" class="space-y-4">
              <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-[0.18em] text-zinc-500">Email</label>
                <input id="login-email" type="email" value="${escapeHtml(ADMIN_EMAIL)}" required autocomplete="username" class="field-dark w-full rounded-xl px-3.5 py-2.5 text-sm">
              </div>
              <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-[0.18em] text-zinc-500">Senha</label>
                <input id="login-password" type="password" required autocomplete="current-password" class="field-dark w-full rounded-xl px-3.5 py-2.5 text-sm">
              </div>
              <label class="flex items-center gap-2 text-sm text-zinc-400">
                <input id="login-remember" type="checkbox" class="h-4 w-4 rounded border-white/20 bg-transparent text-rose-500 focus:ring-rose-500/40">
                Lembrar de mim
              </label>
              <button type="submit" class="w-full rounded-xl bg-[#E8205E] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-rose-600">Entrar</button>
            </form>
            <p id="login-message" class="mt-4 text-sm ${message ? 'text-orange-200' : 'text-zinc-500'}">${escapeHtml(message)}</p>
          </section>
        </main>
      `;
      bindLoginForm();
    }

    function bindLoginForm() {
      const form = document.getElementById('login-form');
      const messageEl = document.getElementById('login-message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('login-email').value;
        if (isProcessing()) return;
        const password = document.getElementById('login-password').value;
        const remember = document.getElementById('login-remember').checked;

        messageEl.textContent = 'Entrando...';
        messageEl.className = 'mt-4 text-sm text-zinc-500';

        return withProcessing('Entrando no CRM...', async () => {
          try {
            const response = await fetch(`${API_URL}?action=login`, {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password, remember })
            });
            const data = await response.json();
            if (!data.success) throw new Error(data.error || 'Erro ao entrar');

            await bootPipelines();
            await loadLeads({ withinOperation: true });
          } catch (error) {
            messageEl.textContent = error.message;
            messageEl.className = 'mt-4 text-sm text-rose-300';
          }
        });
      });
    }

    function buildPipelineEntry(p) {
      const isNeon = p.driver === 'neon';
      return {
        key: p.key,
        driver: p.driver,
        display: p.display || {},
        title: p.name,
        heading: p.name,
        eyebrow: isNeon ? 'Google Sheets CSV' : 'Pipeline',
        subtitle: isNeon
          ? 'Pipeline conectado à planilha publicada, sincronizado por Lead_ID.'
          : 'Pipeline principal com importação manual e status salvos em produção.',
        badge: isNeon ? 'Google Sheets' : 'CSV manual',
        statuses: p.statuses || [],
        boardStatuses: p.board_statuses || null,
        supportsImport: !!p.supports_import,
        supportsSync: !!p.supports_sync,
        supportsDelete: !!p.supports_delete,
        searchPlaceholder: isNeon
          ? 'Buscar por nome, email, telefone ou Lead_ID'
          : 'Buscar por nome'
      };
    }

    async function bootPipelines() {
      return withProcessing('Carregando as planilhas disponíveis...', async () => {
        const response = await apiFetch(`${API_URL}?action=pipelines`);
        const data = await response.json();
        if (!data.success || !Array.isArray(data.pipelines) || !data.pipelines.length) {
          throw new Error(data.error || 'Não foi possível carregar as planilhas.');
        }
        const built = {};
        data.pipelines.forEach((p) => { built[p.key] = buildPipelineEntry(p); });
        PIPELINES = built;
        if (!PIPELINES[currentPipeline]) currentPipeline = data.pipelines[0].key;
      }, { allowNested: true });
    }

    async function initApp() {
      return withProcessing('Verificando o acesso ao CRM...', async () => {
        try {
          const res = await apiFetch(`${API_URL}?action=session`);
          const session = await res.json();
          if (!session.success) throw new Error(session.error || 'Falha ao verificar a sessão.');
          if (session.needs_setup) return renderSetupScreen();
          if (!session.authenticated) return renderLoginScreen();
          await bootPipelines();
          await loadLeads({ withinOperation: true });
        } catch (error) {
          app.innerHTML = `<main class="app-shell flex min-h-screen items-center justify-center px-4">
            <section class="soft-panel max-w-lg rounded-2xl p-6" role="alert">
              <h1 class="text-xl font-bold">Não foi possível conectar ao CRM</h1>
              <p class="mt-3 text-sm text-rose-200">${escapeHtml(error.message)}</p>
              <button id="retry-startup" class="mt-5 rounded-xl bg-[#E8205E] px-4 py-2 text-white">Tentar novamente</button>
            </section></main>`;
          document.getElementById('retry-startup').addEventListener('click', initApp);
        }
      });
    }

    initApp();
  </script>
</body>
